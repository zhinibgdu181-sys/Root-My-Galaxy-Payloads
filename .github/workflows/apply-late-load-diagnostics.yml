name: Apply KernelSU late-load diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-late-load-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch native late-load diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/su_daemon.c')
          s = path.read_text()

          if 'wait_status_diagnostic' not in s:
              anchor = '\nstatic int recv_hold_fds('
              i = s.index(anchor)
              helper = r'''

          static int wait_status_diagnostic(pid_t pid, const char *label) {
            int status;
            dprintf(STDOUT_FILENO, "[*] %s_WAIT pid=%d\n", label, pid);
            for (;;) {
              pid_t waited = waitpid(pid, &status, 0);
              if (waited == pid) break;
              if (waited < 0 && errno == EINTR) continue;
              dprintf(STDERR_FILENO,
                      "[!] %s_WAIT_ERROR pid=%d errno=%d (%s)\n",
                      label, pid, errno, strerror(errno));
              return 1;
            }
            if (WIFEXITED(status)) {
              int rc = WEXITSTATUS(status);
              dprintf(STDOUT_FILENO, "[*] %s_EXIT pid=%d rc=%d\n", label, pid, rc);
              return rc;
            }
            if (WIFSIGNALED(status)) {
              int sig = WTERMSIG(status);
              dprintf(STDERR_FILENO, "[!] %s_SIGNAL pid=%d signal=%d\n",
                      label, pid, sig);
              return 128 + sig;
            }
            dprintf(STDERR_FILENO,
                    "[!] %s_UNKNOWN_STATUS pid=%d status=0x%x\n",
                    label, pid, status);
            return 1;
          }
          '''
              s = s[:i] + helper + s[i:]

          v0 = s.index('static int verify_kernelsu_control(void) {')
          v1 = s.index('\nstatic int run_kernelsu_late_load(', v0)
          verify = r'''static int verify_kernelsu_control(void) {
            int fd = -1;
            dprintf(STDOUT_FILENO, "[*] KSU_CONTROL_PROBE_START\n");
            errno = 0;
            long reboot_ret = syscall(SYS_reboot, 0xDEADBEEF, 0xCAFEBABE, 0, &fd);
            int reboot_errno = errno;
            dprintf(STDOUT_FILENO,
                    "[*] KSU_CONTROL_PROBE_FD syscall_ret=%ld errno=%d fd=%d\n",
                    reboot_ret, reboot_errno, fd);
            if (fd < 0) {
              dprintf(STDERR_FILENO, "late-load: KernelSU driver fd unavailable\n");
              return 13;
            }

            struct ksu_get_info_cmd info;
            memset(&info, 0, sizeof(info));
            errno = 0;
            int ret = ioctl(fd, _IOR('K', 2, struct ksu_get_info_cmd), &info);
            int saved_errno = errno;
            dprintf(STDOUT_FILENO,
                    "[*] KSU_CONTROL_IOCTL ret=%d errno=%d version=%u flags=0x%x "
                    "uapi=%u features=0x%x\n",
                    ret, saved_errno, info.version, info.flags,
                    info.uapi_version, info.features);
            close(fd);
            if (ret != 0 || info.version == 0 || (info.flags & 1U) == 0 ||
                (info.flags & 4U) == 0) {
              dprintf(STDERR_FILENO,
                      "late-load: KernelSU control check failed ret=%d errno=%d "
                      "version=%u flags=0x%x\n",
                      ret, saved_errno, info.version, info.flags);
              return 14;
            }

            dprintf(STDOUT_FILENO,
                    "KernelSU control verified version=%u flags=0x%x "
                    "uapi=%u features=0x%x\n",
                    info.version, info.flags, info.uapi_version, info.features);
            return 0;
          }
          '''
          s = s[:v0] + verify + s[v1:]

          r0 = s.index('static int run_kernelsu_late_load(')
          r1 = s.index('\nstatic void send_response', r0)
          late = r'''static int run_kernelsu_late_load(struct su_request *request, int conn) {
            dprintf(STDOUT_FILENO, "[*] KSU_NATIVE_START daemon_pid=%d\n", getpid());
            pid_t pid = fork();
            if (pid < 0) {
              dprintf(STDERR_FILENO, "[!] KSU_NATIVE_FORK_ERROR errno=%d (%s)\n",
                      errno, strerror(errno));
              return 1;
            }
            if (pid == 0) {
              if (dup2(request->stdin_fd, STDIN_FILENO) < 0 ||
                  dup2(request->stdout_fd, STDOUT_FILENO) < 0 ||
                  dup2(request->stderr_fd, STDERR_FILENO) < 0 ||
                  fchdir(request->cwd_fd) != 0) {
                _exit(126);
              }
              close(conn);
              close_request_fds(request);
              dprintf(STDOUT_FILENO, "[*] KSU_NATIVE_CHILD pid=%d\n", getpid());

              if (unshare(CLONE_NEWNS) != 0 ||
                  mount(NULL, "/", NULL, MS_REC | MS_PRIVATE, NULL) != 0) {
                dprintf(STDERR_FILENO, "late-load: private mount namespace: %s\n",
                        strerror(errno));
                _exit(10);
              }
              dprintf(STDOUT_FILENO, "[*] KSU_NAMESPACE_OK pid=%d\n", getpid());

              if (mount(KSU_LOADER_PATH, LOGCAT_PATH, NULL, MS_BIND, NULL) != 0) {
                dprintf(STDERR_FILENO, "late-load: bind mount: %s\n", strerror(errno));
                _exit(11);
              }
              dprintf(STDOUT_FILENO,
                      "[*] KSU_BIND_MOUNT_OK source=%s target=%s\n",
                      KSU_LOADER_PATH, LOGCAT_PATH);

              pid_t loader = fork();
              if (loader < 0) {
                dprintf(STDERR_FILENO, "late-load: fork: %s\n", strerror(errno));
                _exit(12);
              }
              if (loader == 0) {
                dprintf(STDOUT_FILENO, "[*] KSU_LOADER_EXEC pid=%d path=%s\n",
                        getpid(), LOGCAT_PATH);
                execl(LOGCAT_PATH, "logcat", "late-load", "--ephemeral",
                      "--package-name", "me.weishu.kernelsu", (char *)NULL);
                dprintf(STDERR_FILENO, "late-load: exec: %s\n", strerror(errno));
                _exit(12);
              }

              dprintf(STDOUT_FILENO, "[*] KSU_LOADER_FORK pid=%d\n", loader);
              int loader_status = wait_status_diagnostic(loader, "KSU_LOADER");
              if (loader_status != 0) {
                _exit(loader_status);
              }
              dprintf(STDOUT_FILENO, "[*] KSU_LOADER_COMPLETE rc=0\n");
              int verify_status = verify_kernelsu_control();
              dprintf(STDOUT_FILENO, "[*] KSU_CONTROL_PROBE_RESULT rc=%d\n",
                      verify_status);
              _exit(verify_status);
            }
            close_request_fds(request);
            dprintf(STDOUT_FILENO, "[*] KSU_NATIVE_CHILD_FORK pid=%d\n", pid);
            return wait_status_diagnostic(pid, "KSU_NATIVE_CHILD");
          }
          '''
          s = s[:r0] + late + s[r1:]
          path.write_text(s)
          PY

          git diff --check
          grep -n 'KSU_.*\(START\|OK\|FORK\|EXEC\|WAIT\|EXIT\|SIGNAL\|IOCTL\|RESULT\)' src/su_daemon.c
          git diff -- src/su_daemon.c
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/su_daemon.c
          git commit -m 'Instrument KernelSU native late-load path'
          git push origin HEAD:main
