name: Publish PowerKey SoftReboot module

on:
  push:
    branches:
      - powerkey-softreboot-v1.1
    paths:
      - 'modules/powerkey-softreboot/**'
      - '.github/workflows/publish-powerkey-softreboot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd modules/powerkey-softreboot
          chmod 0755 service.sh action.sh uninstall.sh
          zip -9 -r "$GITHUB_WORKSPACE/PowerKeySoftReboot-v1.1-LowPower.zip"             module.prop skip_mount config.conf service.sh action.sh uninstall.sh README.txt
          cd "$GITHUB_WORKSPACE"
          sha256sum PowerKeySoftReboot-v1.1-LowPower.zip | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="powerkey-softreboot-v1.1-lowpower"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               PowerKeySoftReboot-v1.1-LowPower.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG"               PowerKeySoftReboot-v1.1-LowPower.zip SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "PowerKey KernelSU SoftReboot v1.1 LowPower"               --notes "KernelSU module: press POWER 4 times within 3 seconds to trigger ksud soft-reboot. Low-power watcher monitors only the KEY_POWER input device."
          fi
