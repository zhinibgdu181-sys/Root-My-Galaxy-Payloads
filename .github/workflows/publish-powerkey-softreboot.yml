name: Publish PowerKey SoftReboot v1.2 Native

on:
  push:
    branches:
      - powerkey-softreboot-v1.2-native
    paths:
      - 'modules/powerkey-softreboot/**'
      - '.github/workflows/publish-powerkey-softreboot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 native watcher
        shell: bash
        run: |
          set -euo pipefail
          MOD="$GITHUB_WORKSPACE/modules/powerkey-softreboot"
          NDK="/usr/local/lib/android/sdk/ndk/29.0.14206865"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          mkdir -p "$MOD/bin"
          "$CC" -O2 -Wall -Wextra -Werror -fPIE -pie \
            "$MOD/native/powerkeyd.c" -o "$MOD/bin/powerkeyd"
          "$STRIP" --strip-unneeded "$MOD/bin/powerkeyd"
          chmod 0755 "$MOD/bin/powerkeyd"

          file "$MOD/bin/powerkeyd"
          readelf -h "$MOD/bin/powerkeyd" | grep -E 'Class:|Machine:|Type:'

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          MOD="$GITHUB_WORKSPACE/modules/powerkey-softreboot"
          chmod 0755 "$MOD/service.sh" "$MOD/action.sh" "$MOD/uninstall.sh" "$MOD/bin/powerkeyd"

          cd "$MOD"
          zip -9 -r "$GITHUB_WORKSPACE/PowerKeySoftReboot-v1.2-Native.zip" \
            module.prop skip_mount config.conf service.sh action.sh uninstall.sh README.txt bin/powerkeyd

          cd "$GITHUB_WORKSPACE"
          sha256sum PowerKeySoftReboot-v1.2-Native.zip | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="powerkey-softreboot-v1.2-native"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              PowerKeySoftReboot-v1.2-Native.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              PowerKeySoftReboot-v1.2-Native.zip SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "PowerKey KernelSU SoftReboot v1.2 Native" \
              --notes "Native ARM64 KEY_POWER watcher using EVIOCGBIT + poll() + flock(). No getevent process. Repeated KernelSU late-load/service invocations remain single-instance."
          fi
