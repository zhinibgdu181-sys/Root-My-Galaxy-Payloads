name: KernelSU v3.3.0 Samsung patch migration

on:
  push:
    branches:
      - upgrade-kernelsu-v3.3.0
    paths:
      - 'kernelsu/**'
      - '.github/workflows/test-kernelsu-v3.3.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4

      - name: Clone KernelSU v3.3.0
        run: |
          git clone --branch v3.3.0 --depth 1 https://github.com/tiann/KernelSU.git KernelSU-v3.3.0
          cd KernelSU-v3.3.0
          test "$(git rev-parse HEAD)" = "932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e"
          git describe --tags --exact-match

      - name: Apply clean Samsung hunks and migrate conflicts
        shell: bash
        run: |
          set -euo pipefail
          cd KernelSU-v3.3.0
          OLD_PATCH="../kernelsu/patches/KernelSU-v3.2.5-samsung-kdp-rkp-defex.patch"

          git apply --reject "$OLD_PATCH" || true

          git checkout HEAD --             kernel/Kbuild             kernel/core/init.c             kernel/hook/arm64/patch_memory.c             userspace/ksud/src/late_load.rs             userspace/ksud/src/utils.rs
          find . -name '*.rej' -delete

          python3 ../kernelsu/tools/migrate_samsung_patch_v3_3_0.py "$PWD"

          # Stage everything so newly-created Samsung source/header files are
          # included in the generated patch as well.
          git add -A
          echo "=== migrated staged diff check ==="
          git diff --cached --check
          git status --short

      - name: Generate v3.3.0 patch
        run: |
          cd KernelSU-v3.3.0
          git diff --cached --binary > ../kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch
          test -s ../kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch

      - name: Validate generated patch from pristine v3.3.0
        run: |
          cd KernelSU-v3.3.0
          git reset --hard HEAD
          git clean -fd
          PATCH="../kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          test -f kernel/compat/samsung_kdp.c
          test -f kernel/compat/samsung_defex.c
          test -f kernel/compat/samsung_defex.h
          test -f kernel/include/ksu_samsung_kdp.h

      - name: Commit generated patch to upgrade branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch
          if git diff --cached --quiet; then
            echo "Generated patch is already current."
          else
            git commit -m "kernelsu: include Samsung sources in v3.3.0 patch"
            git push
          fi
